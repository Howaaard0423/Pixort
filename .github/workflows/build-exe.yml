name: 打包 EXE

# 推送形如 v2.0.0 的标签时自动打包并把 Pixort.exe 附到 Release；
# 也可以在 Actions 页面手动触发（只上传为构建产物）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 运行后端测试
        run: python -m unittest discover -s backend/tests -t backend

      - name: 打包
        run: python -m PyInstaller --clean --noconfirm pixort.spec

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Pixort-windows
          path: dist/Pixort.exe
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pixort.exe
          generate_release_notes: true